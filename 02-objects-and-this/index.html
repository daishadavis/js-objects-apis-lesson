<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 · Objects, Methods & this</title>
  <link rel="stylesheet" href="../assets/base.css" />
</head>
<body>
  <main>
    <h1>🧠 Objects, Methods &amp; <code>this</code></h1>
    <p class="subtitle">A mini guessing game that lives inside one object.</p>

    <div class="card">
      <h2>Try a guess</h2>
      <div class="row">
        <div>
          <label for="letter">One letter</label>
          <input id="letter" type="text" maxlength="1" autocomplete="off" />
        </div>
      </div>
      <button id="guess-btn" class="btn">Guess</button>
      <button id="reset-btn" class="btn btn-outline">Reset</button>
      <p id="progress" class="output">Open script.js to get started.</p>
      <p id="status" class="output"></p>
    </div>

    <div class="card">
      <p>You can also play in the <strong>console</strong>: try <code>game.makeGuess("a")</code>.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
